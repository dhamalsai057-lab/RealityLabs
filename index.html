<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Flappy Bird: Pro Edition</title>
    <style>
        /* --- CSS RESET & BASE STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; touch-action: none; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: block; }
        
        /* --- UI OVERLAYS --- */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .screen { display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.7); padding: 40px; border-radius: 20px; text-align: center; color: white; box-shadow: 0 10px 40px rgba(0,0,0,0.6); backdrop-filter: blur(8px); transition: opacity 0.3s ease, transform 0.3s ease; border: 2px solid rgba(255,255,255,0.15); pointer-events: auto; }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; transform: scale(0.9); position: absolute; }
        
        h1 { font-size: 3rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        p { font-size: 1.2rem; margin-bottom: 20px; color: #ddd; }
        
        /* --- HUD (HEADS UP DISPLAY) --- */
        #hud-top { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
        .hud-item { font-size: 1.5rem; font-weight: bold; color: white; text-shadow: 0 3px 6px rgba(0,0,0,0.8); background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 20px; backdrop-filter: blur(4px); }
        #score-display { font-size: 3rem; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: white; font-weight: 900; text-shadow: 0 4px 8px rgba(0,0,0,0.8); transition: transform 0.1s; }
        
        /* --- MOBILE CONTROLS & BUTTONS --- */
        .btn { pointer-events: auto; background: rgba(255, 255, 255, 0.2); border: 2px solid white; color: white; padding: 12px 24px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: all 0.2s; backdrop-filter: blur(4px); margin-top: 10px; }
        .btn:hover, .btn:active { background: white; color: black; transform: scale(1.05); }
        
        #hud-bottom { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 5; pointer-events: none; }
        #cam-btn { pointer-events: auto; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; width: 60px; height: 60px; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(4px); }
        #cam-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.3); }
        
        #ability-btn { pointer-events: auto; background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none; color: white; padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 15px rgba(255, 75, 43, 0.5); opacity: 0.5; transition: all 0.3s; transform: scale(0.9); }
        #ability-btn.ready { opacity: 1; transform: scale(1); cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 75, 43, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); } }

        /* --- RANKINGS --- */
        .rank-badge { margin: 15px 0; padding: 10px 20px; border-radius: 10px; font-size: 1.5rem; font-weight: bold; display: inline-block; text-transform: uppercase; letter-spacing: 2px; }
        .rank-wood { background: #8b5a2b; color: #f5deb3; border: 2px solid #5c3a21; }
        .rank-bronze { background: #cd7f32; color: #fff; border: 2px solid #8c561b; }
        .rank-silver { background: #c0c0c0; color: #fff; border: 2px solid #808080; }
        .rank-gold { background: #ffd700; color: #fff; border: 2px solid #b8860b; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
        .rank-platinum { background: linear-gradient(45deg, #e5e4e2, #b0e0e6, #e5e4e2); color: #2f4f4f; border: 2px solid #fff; box-shadow: 0 0 20px rgba(176, 224, 230, 0.8); }

    </style>
    
    <!-- ES Module Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="hud-top">
        <div class="hud-item" id="high-score">🏆 0</div>
        <div class="hud-item" id="coin-counter">🪙 0</div>
    </div>
    
    <div id="score-display">0</div>

    <div id="hud-bottom">
        <button id="ability-btn">Shield (Needs 5 🪙)</button>
        <div id="cam-btn" title="Change Camera">🎥</div>
    </div>

    <div id="ui-layer">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>Flappy Pro</h1>
            <p>Tap, Click, or Space to fly.</p>
            <p style="font-size: 0.9rem; color: #aaa;">Collect 🪙 to unlock shields. Break pipes!</p>
            <button class="btn" id="start-btn">Start Game</button>
        </div>
        
        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #ff4444;">Crash!</h1>
            <div id="rank-display" class="rank-badge rank-wood">Wood Rank</div>
            <p id="final-score-text">Score: 0</p>
            <button class="btn" id="restart-btn">Play Again</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- PROCEDURAL AUDIO GENERATOR ---
        // Self-contained sound effects to prevent external asset loading issues
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const SoundFX = {
            playTone: (freq, type, duration, vol=0.1, slideFreq=null) => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            flap: () => SoundFX.playTone(150, 'sine', 0.15, 0.2, 50),
            score: () => {
                SoundFX.playTone(800, 'square', 0.1, 0.05);
                setTimeout(() => SoundFX.playTone(1200, 'square', 0.15, 0.05), 100);
            },
            coin: () => SoundFX.playTone(1200, 'sine', 0.1, 0.1, 2000),
            crash: () => {
                SoundFX.playTone(100, 'sawtooth', 0.3, 0.3, 40);
                setTimeout(() => SoundFX.playTone(80, 'square', 0.2, 0.3, 20), 100);
            },
            shieldOn: () => SoundFX.playTone(400, 'sine', 0.5, 0.2, 800),
            shieldBreak: () => SoundFX.playTone(300, 'square', 0.3, 0.4, 50)
        };

        // --- GAME CONSTANTS & STATE ---
        const CONSTANTS = {
            GRAVITY: 45,
            JUMP_VELOCITY: 16,
            GAME_SPEED: 14,
            PIPE_SPAWN_X: 40,
            PIPE_SPACING: 18,
            PIPE_GAP: 6.5,
            PIPE_WIDTH: 2.5,
            CLOUD_SPEED: 2,
            COINS_FOR_SHIELD: 5
        };

        let state = {
            mode: 'START', // START, PLAYING, GAMEOVER
            score: 0,
            coins: 0,
            highScore: localStorage.getItem('fbp_highscore') || 0,
            velocity_y: 0,
            cameraMode: 0, // 0: Classic, 1: POV, 2: Third-Person
            wingAngle: 0,
            time: 0,
            totalPipesSpawned: 0,
            shieldActive: false
        };

        // --- DOM ELEMENTS ---
        const uiStart = document.getElementById('start-screen');
        const uiGameOver = document.getElementById('game-over-screen');
        const scoreEl = document.getElementById('score-display');
        const highScoreEl = document.getElementById('high-score');
        const coinEl = document.getElementById('coin-counter');
        const finalScoreEl = document.getElementById('final-score-text');
        const rankDisplay = document.getElementById('rank-display');
        const camBtn = document.getElementById('cam-btn');
        const abilityBtn = document.getElementById('ability-btn');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        highScoreEl.innerText = `🏆 ${state.highScore}`;

        // --- THREE.JS SETUP ---
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Optimize mobile performance
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x60a0ff);
        // INCREASED FOG: Helps mask the exact moment pipes spawn/despawn in the distance
        scene.fog = new THREE.Fog(0x60a0ff, 15, 60); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);

        // --- LIGHTING ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 30, 20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 80;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- SEAMLESS PROCEDURAL GROUND ---
        // Instead of moving a mesh (which causes "chunks" or pops), we use a massive stationary plane
        // and animate its texture offset. This guarantees 100% smooth visual scrolling.
        function createGroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const context = canvas.getContext('2d');
            // Draw grass base
            context.fillStyle = '#4aa02c';
            context.fillRect(0, 0, 512, 512);
            // Draw darker alternating strips for speed reference
            context.fillStyle = '#429026';
            for (let i = 0; i < 512; i += 64) {
                context.fillRect(i, 0, 32, 512);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(50, 10);
            return tex;
        }

        const groundTex = createGroundTexture();
        // Create an enormously wide plane that exceeds the camera frustum completely
        const groundGeo = new THREE.PlaneGeometry(300, 100);
        const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1.0 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -10;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- CLOUDS ---
        const clouds = new THREE.Group();
        const cloudGeo = new THREE.IcosahedronGeometry(1, 1);
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0, flatShading: true });
        for (let i = 0; i < 20; i++) {
            const cluster = new THREE.Group();
            const puffCount = 3 + Math.random() * 4;
            for(let j=0; j<puffCount; j++) {
                const puff = new THREE.Mesh(cloudGeo, cloudMat);
                puff.position.set((Math.random()-0.5)*3, (Math.random()-0.5)*1.5, (Math.random()-0.5)*2);
                const s = 1 + Math.random() * 2;
                puff.scale.set(s, s, s);
                cluster.add(puff);
            }
            // Spread clouds widely
            cluster.position.set(Math.random() * 140 - 40, 10 + Math.random() * 20, -15 - Math.random() * 30);
            clouds.add(cluster);
        }
        scene.add(clouds);

        // --- THE BIRD ---
        const bird = new THREE.Group();
        
        const bodyGeo = new THREE.SphereGeometry(0.7, 16, 16); 
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.5 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        
        const bellyGeo = new THREE.SphereGeometry(0.65, 16, 16);
        const bellyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
        const belly = new THREE.Mesh(bellyGeo, bellyMat);
        belly.position.set(0.1, -0.15, 0);
        
        const beakGeo = new THREE.ConeGeometry(0.2, 0.6, 12);
        const beakMat = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 0.4 });
        const beak = new THREE.Mesh(beakGeo, beakMat);
        beak.rotation.z = -Math.PI / 2;
        beak.position.set(0.8, 0, 0);
        beak.castShadow = true;

        const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const pupilGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        
        const rightEye = new THREE.Group();
        const re = new THREE.Mesh(eyeGeo, eyeMat);
        const rp = new THREE.Mesh(pupilGeo, pupilMat);
        rp.position.set(0.1, 0, 0.1);
        rightEye.add(re, rp);
        rightEye.position.set(0.4, 0.25, 0.3);

        const leftEye = new THREE.Group();
        const le = new THREE.Mesh(eyeGeo, eyeMat);
        const lp = new THREE.Mesh(pupilGeo, pupilMat);
        lp.position.set(0.1, 0, -0.1);
        leftEye.add(le, lp);
        leftEye.position.set(0.4, 0.25, -0.3);

        const wingGeo = new THREE.CapsuleGeometry(0.15, 0.6, 4, 8);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
        
        const rightWing = new THREE.Mesh(wingGeo, wingMat);
        rightWing.rotation.x = Math.PI / 2;
        rightWing.position.set(-0.2, 0, 0.7);
        rightWing.castShadow = true;

        const leftWing = new THREE.Mesh(wingGeo, wingMat);
        leftWing.rotation.x = Math.PI / 2;
        leftWing.position.set(-0.2, 0, -0.7);
        leftWing.castShadow = true;

        // Shield Mesh (Invisible by default)
        const shieldGeo = new THREE.SphereGeometry(1.2, 16, 16);
        const shieldMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4, wireframe: true });
        const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
        shieldMesh.visible = false;

        bird.add(body, belly, beak, rightEye, leftEye, rightWing, leftWing, shieldMesh);
        scene.add(bird);

        // --- PROCEDURAL PIPES & COINS ---
        const pipes = [];
        const pipeMaterial = new THREE.MeshStandardMaterial({ color: 0x22cc44, roughness: 0.4, metalness: 0.1 });
        const shaftGeo = new THREE.CylinderGeometry(CONSTANTS.PIPE_WIDTH/2, CONSTANTS.PIPE_WIDTH/2, 30, 16);
        const rimGeo = new THREE.CylinderGeometry(CONSTANTS.PIPE_WIDTH/2 + 0.2, CONSTANTS.PIPE_WIDTH/2 + 0.2, 1, 16);
        
        // Coin Geometry
        const coinGeo = new THREE.TorusGeometry(0.4, 0.15, 8, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8 });

        function createPipeObject() {
            const pair = new THREE.Group();
            
            const topPipe = new THREE.Group();
            const topShaft = new THREE.Mesh(shaftGeo, pipeMaterial);
            topShaft.position.y = 15; 
            topShaft.castShadow = true;
            topShaft.receiveShadow = true;
            const topRim = new THREE.Mesh(rimGeo, pipeMaterial);
            topRim.position.y = 0.5;
            topRim.castShadow = true;
            topPipe.add(topShaft, topRim);

            const botPipe = new THREE.Group();
            const botShaft = new THREE.Mesh(shaftGeo, pipeMaterial);
            botShaft.position.y = -15;
            botShaft.castShadow = true;
            botShaft.receiveShadow = true;
            const botRim = new THREE.Mesh(rimGeo, pipeMaterial);
            botRim.position.y = -0.5;
            botRim.castShadow = true;
            botPipe.add(botShaft, botRim);

            // Add a coin in the center
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.castShadow = true;

            pair.add(topPipe, botPipe, coin);
            pair.userData = { passed: false, currentGap: 0, topBroken: false, botBroken: false, coinActive: true };
            
            scene.add(pair);
            pipes.push(pair);
            return pair;
        }

        function setupPipe(pair, spawnIndex, xPos) {
            pair.position.x = xPos;
            pair.userData.passed = false;
            pair.userData.topBroken = false;
            pair.userData.botBroken = false;
            
            // Restore visibility if previously broken by shield
            pair.children[0].visible = true; 
            pair.children[1].visible = true;

            // 50% chance to spawn a coin if we haven't maxed out ability logic
            pair.userData.coinActive = Math.random() > 0.5;
            pair.children[2].visible = pair.userData.coinActive;
            
            let currentGap = CONSTANTS.PIPE_GAP;
            let gapY = 0;
            
            // Starting stage easing (15 pillars easy)
            if (spawnIndex < 15) {
                const gapBonus = (15 - spawnIndex) * 0.4;
                currentGap = CONSTANTS.PIPE_GAP + gapBonus;
                const maxVariance = (spawnIndex / 15) * 8; 
                gapY = (Math.random() - 0.5) * maxVariance;
            } else {
                gapY = (Math.random() - 0.5) * 8; 
            }
            
            pair.position.y = gapY;
            pair.userData.currentGap = currentGap;
            
            pair.children[0].position.y = currentGap / 2;
            pair.children[1].position.y = -currentGap / 2;
            pair.children[2].position.y = 0; // Coin exactly in center of gap
        }

        // Initialize Object Pool
        for (let i = 0; i < 7; i++) {
            const pair = createPipeObject();
            setupPipe(pair, state.totalPipesSpawned++, CONSTANTS.PIPE_SPAWN_X + i * CONSTANTS.PIPE_SPACING);
        }

        // --- CAMERA LOGIC ---
        const currentCamPos = new THREE.Vector3(3, 2, 20);
        const currentLookAt = new THREE.Vector3(5, -1, 0);
        const targetCamPos = new THREE.Vector3();
        const targetLookAt = new THREE.Vector3();
        
        function updateCamera(delta) {
            if (state.cameraMode === 0) { // Classic
                targetCamPos.set(bird.position.x + 4, bird.position.y + 2, 22);
                targetLookAt.set(bird.position.x + 6, bird.position.y - 1, 0);
            } else if (state.cameraMode === 1) { // POV
                targetCamPos.set(bird.position.x + 0.5, bird.position.y + 0.2, 0);
                targetLookAt.set(bird.position.x + 20, bird.position.y - (state.velocity_y * 0.1), 0);
            } else if (state.cameraMode === 2) { // Third Person Follow
                targetCamPos.set(bird.position.x - 8, bird.position.y + 4, 0);
                targetLookAt.set(bird.position.x + 10, bird.position.y - 1, 0);
            }

            const lerpFactor = 8 * delta; 
            currentCamPos.lerp(targetCamPos, lerpFactor);
            currentLookAt.lerp(targetLookAt, lerpFactor);

            camera.position.copy(currentCamPos);
            camera.lookAt(currentLookAt);
        }

        // --- MECHANICS & LOGIC ---
        function setRankDisplay() {
            rankDisplay.className = 'rank-badge'; // reset
            let rank = 'Wood';
            let rClass = 'rank-wood';
            if (state.score >= 11 && state.score <= 20) { rank = 'Bronze'; rClass = 'rank-bronze'; }
            else if (state.score >= 21 && state.score <= 40) { rank = 'Silver'; rClass = 'rank-silver'; }
            else if (state.score >= 41 && state.score <= 70) { rank = 'Gold'; rClass = 'rank-gold'; }
            else if (state.score >= 71) { rank = 'Platinum'; rClass = 'rank-platinum'; }
            
            rankDisplay.innerText = `${rank} Rank`;
            rankDisplay.classList.add(rClass);
        }

        function activateShield(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (state.coins >= CONSTANTS.COINS_FOR_SHIELD && !state.shieldActive && state.mode === 'PLAYING') {
                state.coins -= CONSTANTS.COINS_FOR_SHIELD;
                state.shieldActive = true;
                shieldMesh.visible = true;
                SoundFX.shieldOn();
                updateUI();
            }
        }

        function jump(e) {
            // Prevent double-firing if clicking a button
            if (e && e.target && e.target.tagName === 'BUTTON') return;
            if (e && e.target && e.target.id === 'cam-btn') return;

            if (state.mode === 'START') {
                state.mode = 'PLAYING';
                uiStart.classList.add('hidden');
                state.velocity_y = CONSTANTS.JUMP_VELOCITY;
                SoundFX.flap();
            } else if (state.mode === 'PLAYING') {
                state.velocity_y = CONSTANTS.JUMP_VELOCITY;
                bird.rotation.z = Math.PI / 4; 
                SoundFX.flap();
            } else if (state.mode === 'GAMEOVER') {
                resetGame();
            }
        }

        function updateUI() {
            scoreEl.innerText = state.score;
            coinEl.innerText = `🪙 ${state.coins}`;
            if (state.coins >= CONSTANTS.COINS_FOR_SHIELD && !state.shieldActive) {
                abilityBtn.classList.add('ready');
                abilityBtn.innerText = "🛡️ ACTIVATE SHIELD!";
            } else {
                abilityBtn.classList.remove('ready');
                abilityBtn.innerText = `Shield (Needs ${CONSTANTS.COINS_FOR_SHIELD} 🪙)`;
            }
        }

        function gameOver() {
            if (state.mode === 'GAMEOVER') return;
            state.mode = 'GAMEOVER';
            SoundFX.crash();
            
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('fbp_highscore', state.highScore);
                highScoreEl.innerText = `🏆 ${state.highScore}`;
            }
            
            setRankDisplay();
            finalScoreEl.innerText = `Score: ${state.score}  |  Coins: ${state.coins}`;
            uiGameOver.classList.remove('hidden');
            bird.rotation.z = -Math.PI / 2; 
        }

        function resetGame() {
            state.score = 0;
            state.velocity_y = 0;
            state.totalPipesSpawned = 0;
            state.shieldActive = false;
            shieldMesh.visible = false;
            
            updateUI();
            
            bird.position.set(0, 0, 0);
            bird.rotation.set(0, 0, 0);
            
            pipes.forEach((pair, index) => {
                setupPipe(pair, state.totalPipesSpawned++, CONSTANTS.PIPE_SPAWN_X + index * CONSTANTS.PIPE_SPACING);
            });
            
            uiGameOver.classList.add('hidden');
            uiStart.classList.remove('hidden');
            state.mode = 'START';
        }

        const birdSphere = new THREE.Sphere(new THREE.Vector3(), 0.55);
        const topBox = new THREE.Box3();
        const botBox = new THREE.Box3();
        const coinBox = new THREE.Box3();

        function checkCollisions() {
            birdSphere.center.copy(bird.position);
            
            if (bird.position.y < -9 || bird.position.y > 17) {
                gameOver();
                return;
            }

            for (let i = 0; i < pipes.length; i++) {
                const pair = pipes[i];
                if (Math.abs(pair.position.x - bird.position.x) > CONSTANTS.PIPE_WIDTH + 2) continue;

                const gapY = pair.position.y;
                const gap = pair.userData.currentGap;

                // Coin Collection
                if (pair.userData.coinActive) {
                    coinBox.setFromObject(pair.children[2]);
                    if (coinBox.intersectsSphere(birdSphere)) {
                        pair.userData.coinActive = false;
                        pair.children[2].visible = false;
                        state.coins++;
                        SoundFX.coin();
                        updateUI();
                    }
                }

                // Pipe Collisions
                let hitTop = false;
                let hitBot = false;

                if (!pair.userData.topBroken) {
                    topBox.min.set(pair.position.x - CONSTANTS.PIPE_WIDTH/2, gapY + gap/2, -CONSTANTS.PIPE_WIDTH/2);
                    topBox.max.set(pair.position.x + CONSTANTS.PIPE_WIDTH/2, 30, CONSTANTS.PIPE_WIDTH/2);
                    if (topBox.intersectsSphere(birdSphere)) hitTop = true;
                }

                if (!pair.userData.botBroken) {
                    botBox.min.set(pair.position.x - CONSTANTS.PIPE_WIDTH/2, -30, -CONSTANTS.PIPE_WIDTH/2);
                    botBox.max.set(pair.position.x + CONSTANTS.PIPE_WIDTH/2, gapY - gap/2, CONSTANTS.PIPE_WIDTH/2);
                    if (botBox.intersectsSphere(birdSphere)) hitBot = true;
                }

                if (hitTop || hitBot) {
                    if (state.shieldActive) {
                        // Break Shield and Pipe
                        state.shieldActive = false;
                        shieldMesh.visible = false;
                        SoundFX.shieldBreak();
                        
                        if (hitTop) {
                            pair.userData.topBroken = true;
                            pair.children[0].visible = false;
                        } else {
                            pair.userData.botBroken = true;
                            pair.children[1].visible = false;
                        }
                    } else {
                        gameOver();
                        break;
                    }
                }
            }
        }

        // --- EVENT LISTENERS ---
        window.addEventListener('mousedown', jump);
        window.addEventListener('touchstart', (e) => { 
            if(e.target.tagName !== 'BUTTON' && e.target.id !== 'cam-btn') {
                e.preventDefault(); jump(); 
            }
        }, { passive: false });
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); jump(); }
            if (e.code === 'KeyC') { cycleCamera(); }
        });

        camBtn.addEventListener('click', (e) => { e.stopPropagation(); cycleCamera(); });
        camBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); cycleCamera(); }, { passive: false });
        
        abilityBtn.addEventListener('click', activateShield);
        abilityBtn.addEventListener('touchstart', activateShield, { passive: false });
        
        startBtn.addEventListener('click', jump);
        restartBtn.addEventListener('click', jump);

        function cycleCamera() {
            state.cameraMode = (state.cameraMode + 1) % 3;
            // Provide mild haptic feedback if available on mobile
            if (navigator.vibrate) navigator.vibrate(50);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.05); // Frame capping
            state.time += delta;

            if (state.mode === 'START') {
                bird.position.y = Math.sin(state.time * 4) * 0.5;
                bird.rotation.z = Math.sin(state.time * 2) * 0.1;
                rightWing.rotation.z = Math.sin(state.time * 10) * 0.4;
                leftWing.rotation.z = -Math.sin(state.time * 10) * 0.4;
            } 
            else if (state.mode === 'PLAYING') {
                state.velocity_y -= CONSTANTS.GRAVITY * delta;
                bird.position.y += state.velocity_y * delta;
                
                const targetRotationZ = Math.min(Math.PI / 4, Math.max(-Math.PI / 2, state.velocity_y * 0.05));
                bird.rotation.z += (targetRotationZ - bird.rotation.z) * 15 * delta;

                const wingSpeed = state.velocity_y > 0 ? 30 : 5;
                state.wingAngle += wingSpeed * delta;
                rightWing.rotation.z = Math.sin(state.wingAngle) * 0.5;
                leftWing.rotation.z = -Math.sin(state.wingAngle) * 0.5;

                // Animate shield if active
                if(state.shieldActive) {
                    shieldMesh.rotation.x += delta;
                    shieldMesh.rotation.y += delta * 2;
                }

                const moveDist = CONSTANTS.GAME_SPEED * delta;
                
                for (let i = 0; i < pipes.length; i++) {
                    const pair = pipes[i];
                    pair.position.x -= moveDist;
                    
                    // Rotate coins
                    if(pair.userData.coinActive) {
                        pair.children[2].rotation.y += delta * 3;
                    }
                    
                    if (!pair.userData.passed && pair.position.x < bird.position.x) {
                        pair.userData.passed = true;
                        state.score++;
                        SoundFX.score();
                        updateUI();
                        scoreEl.style.transform = 'translateX(-50%) scale(1.4)';
                        setTimeout(() => scoreEl.style.transform = 'translateX(-50%) scale(1)', 150);
                    }
                    
                    // Recycle logic (Seamless behind fog)
                    if (pair.position.x < bird.position.x - 20) {
                        let maxX = -Infinity;
                        for(let j=0; j<pipes.length; j++) if(pipes[j].position.x > maxX) maxX = pipes[j].position.x;
                        setupPipe(pair, state.totalPipesSpawned++, maxX + CONSTANTS.PIPE_SPACING);
                    }
                }
                checkCollisions();
            }
            else if (state.mode === 'GAMEOVER') {
                if (bird.position.y > -9) {
                    state.velocity_y -= CONSTANTS.GRAVITY * 1.5 * delta;
                    bird.position.y += state.velocity_y * delta;
                }
                rightWing.rotation.z = 0;
                leftWing.rotation.z = 0;
            }

            // Background Animations
            clouds.children.forEach(cluster => {
                cluster.position.x -= CONSTANTS.CLOUD_SPEED * delta;
                if (cluster.position.x < -60) cluster.position.x = 100;
            });
            
            // Seamless Ground Texture Scrolling (No chunks!)
            if (state.mode !== 'GAMEOVER') {
                // Adjust texture offset based on game speed
                groundTex.offset.x -= (CONSTANTS.GAME_SPEED / 50) * delta;
            }

            updateCamera(delta);
            renderer.render(scene, camera);
        }

        // Initialize Audio context on first interaction
        document.body.addEventListener('pointerdown', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        updateUI();
        animate();
    </script>
</body>
